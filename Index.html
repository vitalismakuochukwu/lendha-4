<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TailAdmin Hero Section</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="hero-section">
    <div class="hero-container">
      
      <div class="brand-wrapper">
        <div class="brand-logo-box">
          <img src="tes.png" alt="TailAdmin Logo" class="brand-icon">
        </div>
        <span class="brand-name">TailAdmin</span>
      </div>

      <h1 class="hero-title">
        Figma - Tailwind CSS Admin <br class="desktop-only"> Dashboard Template
      </h1>

      <div class="badge-container">
        <div class="feature-badge">
          <img src="yes.png" alt="" class="badge-img">
          <span class="badge-text">Figma-Tailwind-React</span>
        </div>
        <div class="feature-badge">
          <img src="ues.png" alt="" class="badge-img">
          <span class="badge-text">400+ UI Elements</span>
        </div>
        <div class="feature-badge">
          <img src="ies.png" alt="Unique Dashboards" class="badge-img">
          <span class="badge-text">4 Unique Dashboards</span>
        </div>
      </div>

      <div class="tech-stack-container">
        <div class="tech-icon-card" title="Figma">
          <img src="ket.png" alt="" class="tech-png">
        </div>
        <div class="tech-icon-card" title="Tailwind CSS">
          <img src="zet.png" alt="" class="tech-png">
        </div>
        <div class="tech-icon-card" title="HTML5">
          <img src="fet.png" alt="" class="tech-png">
        </div>
        <div class="tech-icon-card" title="React">
          <img src="set.png" alt="" class="tech-png">
        </div>
        <div class="tech-icon-card" title="JavaScript">
          <img src="jet.png" alt="" class="tech-png">
        </div>
        <div class="tech-icon-card" title="Build Tools">
          <img src="yet.png" alt="" class="tech-png">
        </div>
        <div class="tech-icon-card" title="App Architecture">
          <img src="met.png" alt="" class="tech-png">
        </div>
      </div>

      <div class="mockup-outer-frame">
        <div class="mockup-display-area">
          
          <div class="dash-mockup mockup-left">
            <img src="yed.png" alt="" class="mockup-png">
          </div>

          <div class="dash-mockup mockup-center">
            <img src="ted.png" alt="" class="mockup-png">
          </div>

          <div class="dash-mockup mockup-right">
            <img src="med.png" alt="" class="mockup-png">
          </div>

        </div>
      </div>

    </div>
  </section>

</body>
</html>
